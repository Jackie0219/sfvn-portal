<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顺丰越南区业务门户 · SF Vietnam Portal</title>
<style>
  :root{
    --sf-red:#DC1E32;
    --sf-red-dark:#B2151F;
    --ink:#221316;
    --ink-soft:#6E5F62;
    --paper:#FAF7F5;
    --card:#FFFFFF;
    --line:#EAE0DE;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--sf-red);outline-offset:2px}

  /* ===== 顶部品牌条 ===== */
  .topbar{
    background:var(--sf-red);
    color:#fff;
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;
    padding:18px 24px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .brand-mark{
    width:44px;height:44px;flex:none;
    background:#fff;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{width:30px;height:30px}
  .brand-text h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .brand-text p{font-size:12px;opacity:.85;letter-spacing:1.5px;text-transform:uppercase}
  .topbar-date{
    margin-left:auto;font-size:13px;opacity:.9;
    display:flex;align-items:center;gap:8px;
  }

  /* ===== 导航锚点 ===== */
  .module-nav{
    background:#fff;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  .module-nav-inner{
    max-width:1180px;margin:0 auto;padding:0 24px;
    display:flex;gap:4px;overflow-x:auto;
  }
  .module-nav a{
    padding:12px 16px;font-size:14px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;white-space:nowrap;
    transition:color .15s,border-color .15s;
  }
  .module-nav a:hover{color:var(--sf-red);border-bottom-color:var(--sf-red)}

  main{max-width:1180px;margin:0 auto;padding:0 24px 64px}

  /* ===== 公告 ===== */
  .notice{
    margin:28px 0 8px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:5px solid var(--sf-red);
    border-radius:var(--radius);
    padding:20px 24px;
  }
  .notice-head{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .notice-head svg{width:20px;height:20px;color:var(--sf-red);flex:none}
  .notice-head h2{font-size:17px;font-weight:700}
  .notice ul{list-style:none}
  .notice li{
    display:flex;gap:14px;align-items:baseline;
    padding:7px 0;font-size:14.5px;color:var(--ink);
    border-bottom:1px dashed var(--line);
  }
  .notice li:last-child{border-bottom:none}
  .notice time{
    flex:none;font-size:12.5px;color:var(--sf-red);
    font-weight:600;font-variant-numeric:tabular-nums;
  }

  /* ===== 模块 ===== */
  .module{margin-top:44px}
  .module-head{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .module-head .tab{
    width:6px;height:26px;background:var(--sf-red);border-radius:3px;flex:none;
  }
  .module-head h2{font-size:21px;font-weight:700;letter-spacing:.5px}
  .module-head .en{
    font-size:12px;color:var(--ink-soft);letter-spacing:2px;text-transform:uppercase;
    margin-left:4px;padding-top:6px;
  }
  .module-head .count{
    margin-left:auto;font-size:12px;color:var(--ink-soft);
    background:#fff;border:1px solid var(--line);
    padding:3px 10px;border-radius:99px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:14px;
  }
  .tile{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 14px 18px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .tile:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 28px rgba(220,30,50,.10);
    border-color:var(--sf-red);
  }
  .tile .icon{
    width:52px;height:52px;border-radius:13px;
    background:#FBEFF0;color:var(--sf-red);
    display:flex;align-items:center;justify-content:center;
    transition:background .18s,color .18s;
  }
  .tile:hover .icon{background:var(--sf-red);color:#fff}
  .tile .icon svg{width:26px;height:26px}
  .tile .name{font-size:14.5px;font-weight:600;text-align:center}
  .tile .desc{font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.4}

  /* ===== 页脚 ===== */
  footer{
    border-top:1px solid var(--line);
    background:#fff;
  }
  .footer-inner{
    max-width:1180px;margin:0 auto;padding:20px 24px;
    display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;
    font-size:12.5px;color:var(--ink-soft);
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>

/* ================= 渲染（以下一般无需修改） ================= */
function svg(icon){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[icon]||ICONS.box) + '</svg>';
}

var modnav = document.getElementById("modnav");
var wrap = document.getElementById("modules");

MODULES.forEach(function(m,idx){
  var id = "mod-" + idx;
  var a = document.createElement("a");
  a.href = "#" + id;
  a.textContent = m.name;
  modnav.appendChild(a);

  var sec = document.createElement("section");
  sec.className = "module";
  sec.id = id;

  var tiles = m.links.map(function(l){
    return '<a class="tile" href="' + (l.url||PLACEHOLDER) + '" target="_blank" rel="noopener">' +
             '<span class="icon">' + svg(l.i) + '</span>' +
             '<span class="name">' + l.t + '</span>' +
             (l.d ? '<span class="desc">' + l.d + '</span>' : '') +
           '</a>';
  }).join("");

  sec.innerHTML =
    '<div class="module-head"><span class="tab"></span>' +
      '<h2>' + m.name + '</h2><span class="en">' + m.en + '</span>' +
      '<span class="count">' + m.links.length + ' 个入口</span>' +
    '</div>' +
    '<div class="grid">' + tiles + '</div>';
  wrap.appendChild(sec);
});

  now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日 · " + wd;

/* ================= 公告：从 announcements.txt 读取 ================= */
/* 格式：每行一条公告，"日期|正文"，例如 10-25|十一月起调整收派时间
   最新的写在最上面；空行自动忽略；加载失败时显示上面内置的默认公告 */
(function loadNotices(){
  var list = document.getElementById("notice-list");
  fetch("announcements.txt?t=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(text){
      var lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ""; });
      if(!lines.length) return;
      list.innerHTML = lines.map(function(line){
        var sep = line.indexOf("|");
        var d = sep > -1 ? line.slice(0, sep).trim() : "";
        var t = sep > -1 ? line.slice(sep + 1).trim() : line.trim();
        return "<li>" + (d ? "<time>" + d + "</time>" : "") + "<span>" + t + "</span></li>";
      }).join("");
    })
    .catch(function(){ /* 保留内置默认公告 */ });
})();
</script>
